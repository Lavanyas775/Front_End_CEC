<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var num=10;
        for(var i=0;i<num;i++){
            console.log("Javascript");
        }
        for(var i=0;i<num;i++){
            console.log(`${i}`);
        }
        
        for(var i=1;i<=num;i++){
            console.log(`${i}`);
        }
        
        for(var i=1;i<=num;i++){
            console.log(`2 x ${i} = ${2*i}`);
        }
        var limit=20;
        for(var i=1;i<=limit;i++){
            if(i%2!=0){
                console.log(`${i}`);
            }
        }
    </script>
</body>
</html>
