<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 5px solid;
            margin: 15px;
            background-color: rgb(115, 148, 148);
            padding: 20px;
            width: 200px;
            height: 300px;
        }
        .vid{
           border: 5px solid;
            margin: 15px;
            background-color: rgb(115, 148, 148);
            padding: 20px;
            width: 50%;
            height: 400px;
        } 
    
    </style>
</head>
<body>
    <h2>CSS Box Model</h2>
    <div class="box">
        <img src="../Day1/images/restropic.jpg" width="100px" height="100px"><br><br>
        <h3>Blue Heaven</h3>
        <p>Blue Heaven is a most buetifull imaginary restaurant </p>
    </div>
    <div class="vid">
        <video controls>
            <source src="../Day1/images/file_example_MP4_480_1_5MG.mp4" width="20px" height="20px">   
        </video>
        <h3>EARTH</h3>
        <P>Our earth is the 4th planet in the solar system</P>
    </div>
    <div>
        <iframe src="../day2/forms.html" width="200px" height="200px"></iframe>
    </div>

</body>
</html>
