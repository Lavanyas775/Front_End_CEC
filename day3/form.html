<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet" 
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
    crossorigin="anonymous"> -->
      <link rel="stylesheet" href="../bootstrap/bootstrap.min.css">
    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" 
    crossorigin="anonymous"></script>
    <title>Form</title>
    <style>
        body{
            background-color:snow;
        }
         @media screen and (min-width:200px) and (max-width:600px)
         {
            body{
                background-color: aqua;
            }
         }
    </style>
</head>
<body>
<form class="bg-white">
    <div class="container mt-4 bord">
        <div class="mt-4 text-center">
        <h2 class="mb-3 text-primary ">student Registration</h2> 
        </div>
    <div class="mb-3">
        <label class="form-label" for="name">Name</label>
        <input class="form-control" type="text" id="name" name="name">
    </div>
    <div class="mb-3">
        <label class="form-label" for="Email">Email</label>
        <input class="form-control" type="text" id="Email" name="Email" placeholder="example@gnmail.com">
    </div>
    <div class="mb-3">
         <label class="form-label" for="Password">Password</label>
         <input class="form-control" type="password" id="Password" name="Password" >  
    </div>
    <div class="mb-3">
            <label class="form-label" for="Department">Department</label>
            <select class="form-control">
                <option value="ise">ISE</option>
                <option value="CSE">CSE</option>
                <option value="MECH">MECH</option>
                <option value="CIVL">CIVL</option>
            </select>
    </div>
    <div class="mb-3">
           <h5 class="mb-2 text-muted">choose the Gender</h5>
           <label class="form-label" for="male">MALE</label>
           <input class="for-control" type="radio" id="male" name="Gender" value="male"><br>
           <label class="form-label"  for="female">FEMALE</label>
           <input type="radio" id="female" name="Gender" value="female"><br>
           <label class="form-label"  for="others">OTHERS</label>
           <input type="radio" id="others" name="Gender" value="othetrs">     
    </div>
    <div class="mb-3">
           <label class="form-label" for="date">DATE:</label>
           <input class="form-control" type="date" id="date" name="date" required>
    </div>
    <div class="mb-3">
         <label class="form-label" for="photo">Upload Photo </label>
         <input class="form-control" type="file" id="photo" name="photo" accept="photo">
    </div>
    <div class="mb-3">
         <h5 class="mb-3 text-muted">Terms and Conditions</h5>
         <input type="checkbox" name="terms" required>
         <label>I agree to the Terms and conditions</label>
    </div>
    <div class="mb-3 text-dark">
         <textarea>Discription</textarea>
    </div>
     <div class="mb-3">
        <button class="btn btn-success">Submit</button>
        <button class="btn btn-outline-warning">Reset</button>
    </div>
    </div>
</form> 
</body>
</html>
